<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='270' viewBox='0 0 1200 270' role='img' aria-label='Ear Candy — retro-futuristic sound effects store'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#120a24'/><stop offset='1' stop-color='#0a0d1f'/></linearGradient><linearGradient id='screen' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1b0b33'/><stop offset='1' stop-color='#3a0d4a'/></linearGradient><linearGradient id='edge' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#ff2e88'/><stop offset='1' stop-color='#39f3ff'/></linearGradient><style> .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .wave { fill: none; stroke: #39f3ff; stroke-width: 2.5; stroke-dasharray: 8 6; animation: flow 1.6s linear infinite; } @keyframes flow { to { stroke-dashoffset: -28; } } .scan { animation: scan 3s linear infinite; } @keyframes scan { from { transform: translateY(0); } to { transform: translateY(96px); } } @media (prefers-reduced-motion: reduce) { .wave, .scan { animation: none; } } </style><clipPath id='scr'><rect x='878' y='58' width='196' height='112' rx='6'/></clipPath></defs><rect x='1' y='1' width='1198' height='268' rx='18' fill='url(#bg)' stroke='url(#edge)' stroke-width='2'/><text x='44' y='56' class='mono' font-size='13' fill='#39f3ff' letter-spacing='3'>FEATURED · NEW RELEASE</text><text x='42' y='106' class='sans' font-size='46' font-weight='800' fill='#fff'>Ear Candy</text><text x='44' y='140' class='sans' font-size='19' fill='#d7cff0'>A retro-futuristic sound effects store you scroll through like a film:</text><text x='44' y='166' class='sans' font-size='19' fill='#d7cff0'>boot an old computer, fall through the screen, shop a world made of sound.</text><g class='mono' font-size='13'><g transform='translate(44 196)'><rect width='84' height='28' rx='14' fill='#ff2e88