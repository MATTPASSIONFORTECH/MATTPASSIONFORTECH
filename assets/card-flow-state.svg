<svg xmlns="http://www.w3.org/2000/svg" width="590" height="260" viewBox="0 0 590 260" role="img" aria-label="Flow State Audio — Pro Tools shortcuts trainer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#0a0d1f"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .k { fill: #16213a; stroke: #2f4470; }
      .lit { animation: lit 2.4s ease-in-out infinite; }
      @keyframes lit { 0%, 60%, 100% { fill: #16213a; } 20%, 40% { fill: #39f3ff; } }
      @media (prefers-reduced-motion: reduce) { .lit { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="258" rx="18" fill="url(#bg)" stroke="#39f3ff" stroke-opacity=".55" stroke-width="2"/>

  <text x="32" y="48" class="mono" font-size="12" fill="#39f3ff" letter-spacing="3">REACT · TYPESCRIPT</text>
  <text x="30" y="88" class="sans" font-size="32" font-weight="800" fill="#fff">Flow State Audio</text>
  <text x="32" y="118" class="sans" font-size="16" fill="#c9d6ee">Learn every Pro Tools shortcut: an interactive</text>
  <text x="32" y="140" class="sans" font-size="16" fill="#c9d6ee">keyboard, 933-entry searchable guide and quizzes.</text>

  <!-- keycaps: ⌘ + E -->
  <g transform="translate(32 168)" class="mono">
    <rect class="k lit" width="56" height="52" rx="9" stroke-width="1.5"/>
    <text x="28" y="34" text-anchor="middle" font-size="22" fill="#fff">⌘</text>
    <text x="74" y="34" text-anchor="middle" font-size="20" fill="#8aa0c8">+</text>
    <rect class="k lit" x="92" width="56" height="52" rx="9" stroke-width="1.5" style="animation-delay:.25s"/>
    <text x="120" y="34" text-anchor="middle" font-size="22" fill="#fff">E</text>
    <text x="168" y="32" font-size="13" fill="#8aa0c8">→ separate clip</text>
  </g>

  <g class="mono" font-size="12" fill="#8aa0c8" text-anchor="end">
    <text x="558" y="200">933 shortcuts</text>
    <text x="558" y="220">10 workflow scenarios</text>
    <text x="558" y="240" fill="#39f3ff">▶ live demo</text>
  </g>
</svg>
